plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream {
        localProps.load(it)
    }
}

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 559
        versionName "5.5.9"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        if (localProps['storeFile']) {
            release {
                storeFile file(localProps['storeFile'])
                keyAlias localProps['keyAlias']
                keyPassword localProps['storePassword']
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // 无签名配置时回退到 debug 签名，保证 release 也能出包
            signingConfig = localProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    // 两个 rtmp 客户端库（LibRtmp-Client-for-Android 与 media3-datasource-rtmp 传递的 io.antmedia:rtmp-client）
    // 都打包了同名 librtmp-jni.so，实为同一库，任选其一即可
    packaging {
        jniLibs {
            pickFirsts += [
                "lib/arm64-v8a/librtmp-jni.so",
                "lib/armeabi-v7a/librtmp-jni.so",
                "lib/x86/librtmp-jni.so",
                "lib/x86_64/librtmp-jni.so"
            ]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def mode = flavors['mode'] ?: 'mode'
        def abi = flavors['abi'] ?: 'abi'
        variant.outputs.each { output ->
            output.outputFileName.set("${mode}-${abi}.apk")
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable

    // Media3 fork（FongMi/media，含 mpvplayer / ui-danmaku），由 third_party/maven 本地仓库提供
    implementation "androidx.media3:media3-common:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-container:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-database:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-datasource:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-datasource-okhttp:1.11.0-alpha01-fongmi"
    // media3-datasource-rtmp transitively pulls io.antmedia:rtmp-client, which ships the
    // same io.antmedia.rtmp_client.* classes as the direct dependency
    // com.github.mcxinyu:LibRtmp-Client-for-Android (mcxinyu's is a republish of the same
    // package). Exclude the transitive one to avoid duplicate-class conflicts; mcxinyu's
    // classes satisfy media3 at runtime.
    implementation ("androidx.media3:media3-datasource-rtmp:1.11.0-alpha01-fongmi") {
        exclude group: 'io.antmedia', module: 'rtmp-client'
    }
    implementation "androidx.media3:media3-decoder:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-effect:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-exoplayer:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-extractor:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-mpvplayer:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-session:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-ui:1.11.0-alpha01-fongmi"
    implementation "androidx.media3:media3-ui-danmaku:1.11.0-alpha01-fongmi"

    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
}
